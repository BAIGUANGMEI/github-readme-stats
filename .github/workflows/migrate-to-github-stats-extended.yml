name: Migrate to GitHub Stats Extended

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination
        uses: actions/checkout@v4
        with:
          path: destination
      - name: Check out successor
        uses: actions/checkout@v4
        with:
          repository: stats-organization/github-stats-extended
          ref: a9cfee5809ddaecb87cefcc87f66619601981867
          path: successor
      - name: Sync successor application code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s dotglob nullglob
          find destination -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' successor/ destination/
          cd destination
          git add -A
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m 'chore: migrate to github-stats-extended a9cfee5'
          git push https://x-access-token:${GH_TOKEN}@github.com/BAIGUANGMEI/github-readme-stats.git HEAD:master
