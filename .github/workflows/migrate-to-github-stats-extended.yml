name: Migrate to GitHub Stats Extended

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out successor
        uses: actions/checkout@v4
        with:
          repository: stats-organization/github-stats-extended
          ref: a9cfee5809ddaecb87cefcc87f66619601981867
          fetch-depth: 0
          persist-credentials: false
      - name: Replace master with successor commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add destination https://x-access-token:${GH_TOKEN}@github.com/BAIGUANGMEI/github-readme-stats.git
          git push destination +HEAD:refs/heads/master
